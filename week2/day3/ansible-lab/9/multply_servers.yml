---
- hosts: all
  become: true
  pre_tasks:
    - name: upgrade Debian (Ubuntu)
      apt:
        upgrade: dist
        update_cache: yes
      when: ansible_distribution in  ["Ubuntu", "Debian"]

    - name: upgrade Alma (CentOS)
      dnf:
        update_only: yes
        update_cache: yes
      when: ansible_distribution in  ["AlmaLinux", "CentOS"]

- hosts: web_servers
  become: true
  tasks:
    - name: install apache2
      apt:
        name:
          - apache2
        state: latest
      when: ansible_distribution in ["Ubuntu", "Debian"]

    - name: install httpd
      dnf:
        name:
          - httpd
        state: latest
      when: ansible_distribution in ["AlmaLinux", "CentOS"]

- hosts: db_servers
  become: true
  tasks:
    - name: install mariadb (Debian)
      apt:
        name:
          - mariadb-server
        state: latest
      when: ansible_distribution in ["Ubuntu", "Debian"]

    - name: install mariadb (AlmaLinux)
      dnf:
        name:
          - mariadb
        state: latest
      when: ansible_distribution in ["AlmaLinux", "CentOS"]

- hosts: file_servers
  become: true
  tasks:
    - name: install samba (Debian\AlmaLinux)
      package:
        name:
          - samba
        state: latest
      when: ansible_distribution in ["AlmaLinux", "CenOS" ,"Ubuntu", "Debian"]

