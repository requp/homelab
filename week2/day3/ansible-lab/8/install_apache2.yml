---
- hosts: all
  become: true
  tasks:
    - name: update apt packages and install apache2
      apt:
        name:
          - apache2
        state: latest
        update_cache: yes
      when: ansible_distribution in ["Ubuntu", "Debian"]

    - name: update dnf packages and install apache2
      dnf:
        name:
          - httpd
        state: latest
        update_cache: yes
      when: ansible_distribution in ["CentOS", "AlmaLinux"]

