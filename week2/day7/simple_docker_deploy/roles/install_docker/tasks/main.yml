- block:
  - name: Update and install packages
    package:
      name:
        - ca-certificates
        - curl
        - gnupg
      state: latest
      update_cache: yes

  - name: install python3-debian
    package:
      name:
        - python3-debian
      state: latest
    when: ansible_distribution in  ["Ubuntu", "Debian", "Fedora"]

  - name: install dnf-utils
    package:
      name:
        - dnf-utils
      state: latest
    when: ansible_distribution in  ["AlmaLinux", "CentOS"]


  - block:
    - name: Add Docker repository (Debian)
      deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ docker_linux_distro }}/"
        suites: "{{ ansible_lsb.codename }}"
        components: stable
        architectures: amd64
        signed_by: "https://download.docker.com/linux/{{ docker_linux_distro }}/gpg"
    when: ansible_distribution in ["Debian", "Ubuntu"]

  - block:
      - name: Add official Docker CE repository
        ansible.builtin.get_url:
          url: https://download.docker.com/linux/{{ docker_linux_distro }}/docker-ce.repo
          dest: /etc/yum.repos.d/docker-ce.repo
          mode: '0644'
    when: ansible_distribution in ["Fedora", "CentOS", "AlmaLinux"]

  - name: Install docker
    package:
      name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
      state: present
      update_cache: yes

  - name: Start and enable docker
    systemd:
      name: docker
      state: started
      enabled: yes

  when: ansible_distribution in ["Fedora", "CentOS", "AlmaLinux", "Debian", "Ubuntu"]

