services:
  prometheus:
    container_name: prometheus 
    image: prom/prometheus
    volumes:
      - prometheus:/etc/prometheus/
    ports:
      - "9000:9000"
  
  grafana:
    container_name: grafana
    image: grafana/grafana
    ports:
      - "3000:3000"
    env_file:
      - .env
  
  node_exporter:
    image: prom/node-exporter
    ports:
      - "9100:9100"

volumes:
  prometheus: