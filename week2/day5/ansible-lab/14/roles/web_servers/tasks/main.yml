- block:
  - name: Install apache
    apt:
      name: apache2
      state: latest
      update_cache: yes
 
  - name: copy archive
    copy:
      src: html.tar.gz
      dest: /tmp/

  - name: unarchive html files
    unarchive:
      src: /tmp/html.tar.gz
      dest: /var/www/
      remote_src: true

  - name: start and enable apache2
    systemd:
      name: apache2
      state: started
      enabled: yes
  when: ansible_distribution in ["Debian", "Ubuntu"]
